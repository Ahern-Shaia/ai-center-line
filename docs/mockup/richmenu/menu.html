<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  :root {
    --ink: #0F172A; --muted: #64748B; --divider: #E2E8F0;
  }
  .menu {
    display: flex; width: 2500px; overflow: hidden;
    font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background: #fff;
  }
  .menu.large { height: 1686px; }
  .menu.compact { height: 843px; }
  .cell {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; position: relative;
  }
  .cell + .cell { border-left: 3px solid var(--divider); }
  .accent { position: absolute; top: 0; left: 0; right: 0; height: 12px; }
  /* 打卡 · teal */
  .c-punch  { background: #ECFBFA; } .c-punch  .accent { background: #0F766E; } .c-punch  .icon svg { stroke: #0F766E; }
  /* 我的行程 · amber */
  .c-trips  { background: #FBF1E4; } .c-trips  .accent { background: #B45309; } .c-trips  .icon svg { stroke: #B45309; }
  /* 我的日報 · indigo */
  .c-report { background: #EEF0FD; } .c-report .accent { background: #4338CA; } .c-report .icon svg { stroke: #4338CA; }

  .icon { display: flex; align-items: center; justify-content: center; }
  .large .icon svg { width: 250px; height: 250px; }
  .compact .icon svg { width: 150px; height: 150px; }
  .icon svg { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .label { color: var(--ink); font-weight: 700; letter-spacing: 3px; }
  .large .label { font-size: 120px; margin-top: 36px; }
  .compact .label { font-size: 76px; margin-top: 18px; }
  .cap { color: var(--muted); letter-spacing: 5px; }
  .large .cap { font-size: 50px; margin-top: 24px; }
  .compact .cap { font-size: 34px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="menu large" id="menu">
    <div class="cell c-punch">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 21.5s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9.2" r="2.6"/></svg>
      </div>
      <div class="label">打卡</div>
      <div class="cap">外勤定位</div>
    </div>
    <div class="cell c-trips">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="2"/><path d="M5.5 8.2c0 4.2 8 2.6 8 6.6"/><path d="M17 21s3.5-3.3 3.5-6a3.5 3.5 0 1 0-7 0c0 2.7 3.5 6 3.5 6z"/><circle cx="17" cy="15" r="1.3"/></svg>
      </div>
      <div class="label">我的行程</div>
      <div class="cap">路線里程</div>
    </div>
    <div class="cell c-report">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.2"/><path d="M9 3.5h6v3.2H9z"/><line x1="8.6" y1="11" x2="15.4" y2="11"/><line x1="8.6" y1="14.4" x2="15.4" y2="14.4"/><line x1="8.6" y1="17.8" x2="12.8" y2="17.8"/></svg>
      </div>
      <div class="label">我的日報</div>
      <div class="cap">編輯今日</div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("size") === "compact") document.getElementById("menu").className = "menu compact";
  </script>
</body>
</html>
