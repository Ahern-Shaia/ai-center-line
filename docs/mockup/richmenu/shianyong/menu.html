<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>鮮湧 · 圖文選單背景圖（6 宮格 · 2500×1686）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  :root { --ink: #0F172A; --muted: #64748B; --divider: #E2E8F0; }

  /* 3 欄 × 2 列 · 每格 833×843（LINE 大版 2500×1686 的 6 區塊版型）*/
  .menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    width: 2500px; height: 1686px; overflow: hidden;
    font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background: #fff;
  }
  .cell {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; padding: 0 24px;
  }
  /* 格線：右邊界給前兩欄、下邊界給第一列 —— 不用 border 疊加避免佔掉像素 */
  .cell:not(:nth-child(3n))::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0;
    width: 3px; background: var(--divider);
  }
  .cell:nth-child(-n+3)::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 3px; background: var(--divider);
  }
  .accent { position: absolute; top: 0; left: 0; right: 0; height: 12px; }

  /* ── 上排：平台標配（與台灣福祉同一組配色，員工換公司也認得）── */
  .c-punch  { background: #ECFBFA; } .c-punch  .accent { background: #0F766E; } .c-punch  svg { stroke: #0F766E; }
  .c-trips  { background: #FBF1E4; } .c-trips  .accent { background: #B45309; } .c-trips  svg { stroke: #B45309; }
  .c-report { background: #EEF0FD; } .c-report .accent { background: #4338CA; } .c-report svg { stroke: #4338CA; }
  /* ── 下排：鮮湧專屬 ── */
  .c-work   { background: #FDF0F3; } .c-work   .accent { background: #BE123C; } .c-work   svg { stroke: #BE123C; }
  .c-war    { background: #F3EEFD; } .c-war    .accent { background: #6D28D9; } .c-war    svg { stroke: #6D28D9; }
  /* 第 6 格是預寫的 —— 灰階＋「尚未開放」，避免有人照著去接動作 */
  .c-bot    { background: #F1F3F6; } .c-bot    .accent { background: #94A3B8; } .c-bot    svg { stroke: #94A3B8; }
  .c-bot .label { color: #94A3B8; }
  .c-bot .cap   { color: #A8B2C1; }

  .icon { display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 170px; height: 170px; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .label { color: var(--ink); font-weight: 700; letter-spacing: 2px; font-size: 78px; margin-top: 26px; white-space: nowrap; }
  .cap { color: var(--muted); letter-spacing: 4px; font-size: 36px; margin-top: 14px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="menu">

    <!-- 1 · 打卡 -->
    <div class="cell c-punch">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 21.5s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="9.2" r="2.6"/></svg>
      </div>
      <div class="label">打卡</div>
      <div class="cap">外勤定位</div>
    </div>

    <!-- 2 · 我的行程 -->
    <div class="cell c-trips">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="2"/><path d="M5.5 8.2c0 4.2 8 2.6 8 6.6"/><path d="M17 21s3.5-3.3 3.5-6a3.5 3.5 0 1 0-7 0c0 2.7 3.5 6 3.5 6z"/><circle cx="17" cy="15" r="1.3"/></svg>
      </div>
      <div class="label">我的行程</div>
      <div class="cap">路線里程</div>
    </div>

    <!-- 3 · 我的日報 -->
    <div class="cell c-report">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.2"/><path d="M9 3.5h6v3.2H9z"/><line x1="8.6" y1="11" x2="15.4" y2="11"/><line x1="8.6" y1="14.4" x2="15.4" y2="14.4"/><line x1="8.6" y1="17.8" x2="12.8" y2="17.8"/></svg>
      </div>
      <div class="label">我的日報</div>
      <div class="cap">編輯今日</div>
    </div>

    <!-- 4 · 報工單 -->
    <div class="cell c-work">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M14.6 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-7.9"/><line x1="8.7" y1="9.6" x2="13.4" y2="9.6"/><line x1="8.7" y1="13.2" x2="12" y2="13.2"/><path d="M17.1 3.1l3.3 3.3-5.4 5.4h-3.3V8.5z"/></svg>
      </div>
      <div class="label">報工單</div>
      <div class="cap">填寫回報</div>
    </div>

    <!-- 5 · 智慧聯網戰情室 -->
    <div class="cell c-war">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M3.6 17.4a8.8 8.8 0 1 1 16.8 0"/><path d="M12 17.4l4.2-5.2"/><circle cx="12" cy="17.4" r="1.4"/><line x1="12" y1="5.4" x2="12" y2="7"/><line x1="4.9" y1="10.4" x2="6.4" y2="11"/><line x1="19.1" y1="10.4" x2="17.6" y2="11"/></svg>
      </div>
      <div class="label">智慧聯網戰情室</div>
      <div class="cap">營運總覽</div>
    </div>

    <!-- 6 · 內部客服機器人（預寫 · 尚未開放）-->
    <div class="cell c-bot">
      <div class="accent"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24"><rect x="4.4" y="8.2" width="15.2" height="11.2" rx="3.2"/><line x1="12" y1="8.2" x2="12" y2="5.6"/><circle cx="12" cy="4.3" r="1.4"/><circle cx="9.1" cy="13.2" r="1.1"/><circle cx="14.9" cy="13.2" r="1.1"/><line x1="10.2" y1="16.6" x2="13.8" y2="16.6"/></svg>
      </div>
      <div class="label">內部客服機器人</div>
      <div class="cap">尚未開放</div>
    </div>

  </div>
</body>
</html>
