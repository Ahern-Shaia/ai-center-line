body{background:var(--bg);color:var(--ink);

.sub{font-size:12.5px;color:var(--ink2);margin-top:4px;}

.sim b{color:#f5c6ca;font-weight:600;}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.kc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;}
.kl{font-size:11.5px;color:var(--ink2);margin-bottom:4px;}
.kv{font-size:22px;font-weight:500;line-height:1.15;}
.kv small{font-size:12.5px;font-weight:400;color:var(--ink2);}
.kh{font-size:11px;color:var(--ink3);margin-top:3px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;margin-bottom:13px;}
.h{font-size:14.5px;font-weight:500;margin-bottom:3px;}
.s{font-size:11.5px;color:var(--ink3);margin-bottom:11px;line-height:1.7;}
.bars{display:flex;flex-direction:column;gap:9px;}
.row{display:grid;grid-template-columns:44px 1fr 78px;align-items:center;gap:9px;font-size:12.5px;}
.nm{color:var(--ink2);font-family:ui-monospace,monospace;}
.track{display:block;height:15px;background:var(--card2);border-radius:4px;overflow:hidden;}
.fill{display:block;height:100%;border-radius:4px;min-width:2px;}
.val{text-align:right;font-family:ui-monospace,monospace;}
.cw{width:100%;height:190px;}
.cap{font-size:11px;color:var(--ink3);text-align:center;margin-top:7px;line-height:1.8;}
.note{background:#231d14;border:1px solid #4a3a1e;border-radius:9px;padding:10px 12px;
  font-size:12px;color:#e0c48a;line-height:1.85;margin-top:11px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--ink2);font-weight:500;padding:7px 6px;
  border-bottom:1px solid var(--line);font-size:11.5px;}
td{padding:8px 6px;border-bottom:1px solid #22252b;color:#c9ccd2;}
td.n,th.n{text-align:right;font-family:ui-monospace,monospace;}
.pill{font-size:11px;padding:2px 7px;border-radius:7px;}
/* 日期選擇：可點區 ≥44px（手指不是滑鼠） */
.days{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;}
.day{flex:none;min-height:44px;padding:7px 11px;background:var(--card2);
  border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--ink2);
  display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
.day.on{border-color:#3b82f6;background:#1b2028;color:var(--ink);}
.day b{font-size:13px;font-weight:500;}
.day span{font-size:10.5px;color:var(--ink3);}
.day.real b{color:var(--ok);}
footer{text-align:center;font-size:11px;color:var(--ink3);margin-top:18px;
  padding-top:12px;border-top:1px solid var(--line);line-height:1.9;}
@media(max-width:420px){.kpi{grid-template-columns:1fr}}
</style>

<script>
(function(){
const M=LABOUR.meta,D=LABOUR.daily,CAP=M.capPerStation;
const C={ok:"#0ca30c",warn:"#eda100",low:"#d03b3b",bar:"#4338CA",mut:"#5f636b"};
const q=x=>document.querySelector(x);
const hm=s=>`${Math.floor(s/3600)}:${String(Math.round(s%3600/60)).padStart(2,"0")}`;
let sel=M.realDay;

q("#sub").textContent=`${M.period}　·　${M.days} 個工作日　·　4 工位　·　${M.totalEvents.toLocaleString()} 筆判讀事件`;

/* ⚠️ 這一段是這頁的前提不是裝飾 —— 30 天裡只有 1 天對應原始報表。
   拿掉就等於把模擬數字當實測給客戶看。 */
q("#sim").innerHTML=
 `⚠️ <b>模擬資料 / Simulated data</b>　·　${M.days} 個工作日中<b>僅 ${M.realDay} 對應原始報表</b>，`
 +`其餘 ${M.days-1} 日為產生資料。<br>`
 +`Only ${M.realDay} maps to the original report; the other ${M.days-1} days are generated.`;

const rates=D.map(d=>d.rate),lo=Math.min(...rates),hi=Math.max(...rates);
const loD=D.find(d=>d.rate===lo),hiD=D.find(d=>d.rate===hi);
const best=M.stationAvg.indexOf(Math.max(...M.stationAvg)),worst=M.stationAvg.indexOf(Math.min(...M.stationAvg));
q("#kpi").innerHTML=[
 ["期間平均稼動率<br><span style='font-size:10.5px;color:var(--ink3)'>Avg utilisation</span>",
  `${(M.avgRate*100).toFixed(1)}<small>%</small>`,`${M.days} 個工作日`,M.avgRate<0.5?C.warn:C.ok],
 ["最高 / 最低<br><span style='font-size:10.5px;color:var(--ink3)'>High / Low</span>",
  `${(hi*100).toFixed(0)}<small>%</small> / ${(lo*100).toFixed(0)}<small>%</small>`,
  `${hiD.d.slice(5)} / ${loD.d.slice(5)}`,"#9fa3ab"],
 ["工位落差<br><span style='font-size:10.5px;color:var(--ink3)'>Station gap</span>",
  `${(M.stationAvg[best]/M.stationAvg[worst]).toFixed(1)}<small> 倍</small>`,
  `${M.stations[best]} vs ${M.stations[worst]}`,C.warn],
 ["判讀事件<br><span style='font-size:10.5px;color:var(--ink3)'>Vision events</span>",
  `${M.totalEvents.toLocaleString()}<small> 筆</small>`,"每筆有進出截圖","#9fa3ab"],
].map(k=>`<div class="kc"><div class="kl">${k[0]}</div><div class="kv" style="color:${k[3]}">${k[1]}</div><div class="kh">${k[2]}</div></div>`).join("");

function trend(){
 const W=700,H=190,ml=36,mr=8,mt=12,mb=26;
 const top=Math.max(...rates)*1.12,bw=(W-ml-mr)/D.length;
 const py=v=>mt+(top-v)*(H-mt-mb)/top;
 let g="";
 for(let k=0;k<=3;k++){const v=top*k/3,y=py(v);
  g+=`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="rgba(137,135,129,.16)"/>`
   +`<text x="${ml-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#7b7f87">${(v*100).toFixed(0)}%</text>`;}
 D.forEach((d,i)=>{
  const x=ml+i*bw;
  /* 真實那天優先綠 —— 圖例說綠是它，顏色就不能被「有備註」蓋掉 */
  const col=d.d===M.realDay?C.ok:(d.note?C.warn:C.bar);
  g+=`<g data-d="${d.d}" style="cursor:pointer"><rect x="${x+1}" y="${py(d.rate)}" width="${bw-2}" `
   +`height="${py(0)-py(d.rate)}" fill="${col}" opacity="${sel===d.d?1:.7}" rx="2"/>`
   +`<rect x="${x}" y="${mt}" width="${bw}" height="${H-mt-mb}" fill="transparent"/></g>`;
  if(i===0||i===D.length-1)
   g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="9.5" fill="#7b7f87">${d.d.slice(5)}</text>`;});
 const ay=py(M.avgRate);
 g+=`<line x1="${ml}" y1="${ay}" x2="${W-mr}" y2="${ay}" stroke="#8b8f97" stroke-dasharray="5 3"/>`
  +`<text x="${ml+4}" y="${ay-5}" font-size="10" fill="#9fa3ab">平均 ${(M.avgRate*100).toFixed(1)}%</text>`;
 q("#trend").innerHTML=g;
 q("#trend").querySelectorAll("g[data-d]").forEach(el=>el.onclick=()=>{sel=el.dataset.d;render();});
 q("#tcap").innerHTML=`綠＝${M.realDay}（唯一對應原始報表）　·　黃＝有特殊事件　·　點長條看當日`;
}

const bars=(el,rows)=>q(el).innerHTML=rows.map(r=>
 `<div class="row"><span class="nm">${r[0]}</span>`
 +`<span class="track"><span class="fill" style="width:${(r[1]*100).toFixed(1)}%;background:${r[3]}"></span></span>`
 +`<span class="val">${r[2]}</span></div>`).join("");

bars("#station",M.stations.map((n,i)=>{const p=M.stationAvg[i]/CAP;
 return [n,p,`${hm(M.stationAvg[i])} ${(p*100).toFixed(0)}%`,p>=.55?C.ok:p>=.3?C.warn:C.low];}));
q("#gap").innerHTML=
 `<b>${M.stations[worst]}</b> 平均每日 ${hm(M.stationAvg[worst])}，是 <b>${M.stations[best]}</b>（${hm(M.stationAvg[best])}）的 `
 +`<b>${(M.stationAvg[worst]/M.stationAvg[best]*100).toFixed(0)}%</b>。<br>`
 +`⚠️ 這是「人在工位的時間」不是「產出」—— 落差大不一定代表閒置，也可能是該工位工序本來就短。要判斷得對照工單。<br>`
 +`<span style="color:#b9a77e">This measures presence, not output.</span>`;

const NM={am:"上午",pm:"下午",night:"晚上"};
const tot=["am","pm","night"].reduce((a,k)=>a+M.slotAvg[k].reduce((p,q2)=>p+q2,0),0);
bars("#slot",["am","pm","night"].map(k=>{const v=M.slotAvg[k].reduce((a,b)=>a+b,0);
 return [NM[k],v/tot,`${hm(v)} ${(v/tot*100).toFixed(0)}%`,k==="night"?C.mut:C.bar];}));

function days(){
 q("#dayhint").innerHTML=`左右滑動選日期　·　<b style="color:${C.ok}">${M.realDay}</b> 是唯一對應原始報表的一天`;
 q("#days").innerHTML=D.map(d=>
  `<div class="day${sel===d.d?" on":""}${d.d===M.realDay?" real":""}" data-d="${d.d}">`
  +`<b>${d.d.slice(5)}</b><span>${(d.rate*100).toFixed(0)}%${d.note?" ●":""}</span></div>`).join("");
 q("#days").querySelectorAll(".day").forEach(el=>el.onclick=()=>{sel=el.dataset.d;render();});
 const on=q("#days .day.on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
}

function daybody(){
 const d=D.find(x=>x.d===sel),real=d.d===M.realDay;
 let h=`<div class="s" style="margin:12px 0 9px">`
  +`<b style="color:var(--ink);font-size:13px">${d.d}（${d.dow}）</b>　稼動率 ${(d.rate*100).toFixed(1)}%　·　合計 ${hm(d.total)}　·　${d.nEvents} 筆事件`
  +(d.note?`<br><b style="color:${C.warn}">${d.note}</b>`:"")
  +`<br>${real?`<b style="color:${C.ok}">此日對應原始報表 / matches original report</b>`
              :`<b style="color:#e8a9ae">此日為產生資料，逐事件明細不列出</b>`}</div>`;
 h+=`<div style="overflow-x:auto"><table><thead><tr><th>工位</th><th class="n">上午</th><th class="n">下午</th>`
  +`<th class="n">晚上</th><th class="n">合計</th><th class="n">佔可用</th></tr></thead><tbody>`;
 M.stations.forEach((n,i)=>{const p=d.s[i]/CAP,c=p>=.55?C.ok:p>=.3?C.warn:C.low;
  h+=`<tr><td class="nm">${n}</td><td class="n">${hm(d.slots.am?.[i]??0)}</td>`
   +`<td class="n">${hm(d.slots.pm?.[i]??0)}</td><td class="n">${hm(d.slots.night?.[i]??0)}</td>`
   +`<td class="n">${hm(d.s[i])}</td><td class="n"><span class="pill" style="background:${c}26;color:${c}">${(p*100).toFixed(0)}%</span></td></tr>`;});
 h+=`</tbody></table></div>`;
 /* 逐事件只在真實那天列 —— 產生的事件列成表格會被當成實測（R11） */
 if(real&&LABOUR.realEvents.length){
  h+=`<div class="h" style="margin:16px 0 2px">逐事件明細 / Events　<span style="color:var(--ink3);font-weight:400;font-size:12px">${LABOUR.realEvents.length} 筆</span></div>`
   +`<div class="s">每筆都有人員進入 / 離開的截圖檔名可回查</div>`
   +`<div style="overflow-x:auto;max-height:300px"><table><thead><tr><th>事件編號</th><th>工位</th><th class="n">在工位時間</th></tr></thead><tbody>`
   +LABOUR.realEvents.map(e=>`<tr><td class="nm">${e.id}</td><td>${e.st}</td><td class="n">${hm(e.sec)}</td></tr>`).join("")
   +`</tbody></table></div>`;}
 q("#daybody").innerHTML=h;
}
function render(){trend();days();daybody();}
render();
})();
</script>
</body>
</html>
