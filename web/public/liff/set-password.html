<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>設定密碼 · aiproot</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --ink:#111827; --ink-2:#4B5563; --ink-3:#6B7280;
    --line:#E5E7EB; --well:#F1F3F6;
    --primary:#4F46E5; --primary-tint:#EEF2FF;
    --ok:#059669; --ok-tint:#ECFDF5;
    --warn:#D97706; --warn-tint:#FFFBEB;
    --danger:#DC2626; --danger-tint:#FEF2F2;
    --line-brand:#06C755;
    --sans: 'Noto Sans TC', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:#F9FAFB; color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6; }
  .container { padding:20px 18px 100px; max-width:520px; margin:0 auto; }

  h1 { font-size:20px; font-weight:700; margin:0 0 6px; text-align:center; }
  .sub { text-align:center; color:var(--ink-3); font-size:13px; margin:0 0 20px; }

  .info-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .info-row { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--well); }
  .info-row:last-child { border-bottom:none; }
  .info-row .label { color:var(--ink-3); }

  .field { margin-bottom:14px; }
  .field label { display:block; font-size:13px; color:var(--ink-2); font-weight:500; margin-bottom:6px; }
  .field input { width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:8px; font-size:15px; font-family:inherit; background:#fff; }
  .field input:focus { outline:none; border-color:var(--primary); }
  .field .hint { font-size:11.5px; color:var(--ink-3); margin-top:5px; }

  .rules { background:var(--primary-tint); border:1px solid #C7D2FE; border-radius:8px; padding:10px 12px; font-size:12px; color:#3730A3; margin-bottom:14px; }
  .rules ul { margin:6px 0 0 20px; padding:0; }
  .rules li { margin:2px 0; }

  .btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-bottom:8px; font-family:inherit; }
  .btn.primary { background:var(--line-brand); color:#fff; }
  .btn.secondary { background:transparent; color:var(--ink-2); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .err { padding:10px 12px; border-radius:8px; background:var(--danger-tint); color:var(--danger); font-size:13px; border:1px solid #FCA5A5; margin-bottom:12px; }
  .success { text-align:center; padding:40px 20px; }
  .success .check { width:64px; height:64px; margin:0 auto 14px; border-radius:50%; background:var(--ok); color:#fff; display:flex; align-items:center; justify-content:center; font-size:32px; }
  .success .txt { font-size:16px; font-weight:700; margin-bottom:6px; }
  .success .desc { font-size:13px; color:var(--ink-3); margin-bottom:16px; }

  .loading { text-align:center; padding:60px 20px; color:var(--ink-3); }
  .spinner { display:inline-block; width:24px; height:24px; border:3px solid var(--line); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .hide { display:none; }
</style>
</head>
<body>
<div class="container">

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div style="margin-top:12px; font-size:13px;">載入中…</div>
  </div>

  <div id="form-view" class="hide">
    <h1>設定登入密碼</h1>
    <p class="sub">選配 · 讓你可用 email 登入 aiproot 網頁<br>不設也可以用「以 LINE 登入」</p>

    <div class="info-card">
      <div class="info-row"><span class="label">姓名</span><span id="i-name">-</span></div>
      <div class="info-row"><span class="label">公司</span><span id="i-tenant">-</span></div>
      <div class="info-row"><span class="label">部門</span><span id="i-dept">-</span></div>
    </div>

    <div id="err" class="err hide"></div>

    <div class="field">
      <label>你的 email</label>
      <input type="email" id="f-email" placeholder="you@company.com" autocomplete="email">
      <div class="hint">未來用這個 email 登入 aiproot 網頁</div>
    </div>

    <div class="field">
      <label>密碼</label>
      <input type="password" id="f-password" autocomplete="new-password">
      <div class="hint">建議挑一個好記且沒在其他網站用過的</div>
    </div>

    <div class="field">
      <label>確認密碼</label>
      <input type="password" id="f-password2" autocomplete="new-password">
    </div>

    <div class="rules">
      <b>密碼規則：</b>
      <ul>
        <li>長度 ≥ 12 字元</li>
        <li>含大寫 · 小寫 · 數字 · 符號（四選三）</li>
        <li>不可包含 email 或姓名</li>
      </ul>
    </div>

    <button id="btn-save" class="btn primary">儲存密碼</button>
    <button class="btn secondary" onclick="closeLiff()">取消</button>
  </div>

  <div id="success-view" class="hide">
    <div class="success">
      <div class="check">✓</div>
      <div class="txt">密碼已設定</div>
      <div class="desc">
        以後開電腦看 aiproot · 可用<br>
        <b id="s-email"></b> 登入<br><br>
        <span style="font-size:11.5px; color:var(--ink-3);">1 秒後自動關閉…</span>
      </div>
    </div>
  </div>

</div>

<script>
  const LIFF_ID = "2010801742-WBQkAv5t";
  const API_BASE = window.location.hostname.includes("localhost") || window.location.hostname.includes("127.0.0.1")
    ? window.location.origin
    : "https://ai-center-line.onrender.com";

  let BOT_ID = null;
  let lineUserId = null;
  let userInfo = null;

  function resolveBotId() {
    const q = new URLSearchParams(location.search);
    let id = q.get("botId");
    if (id) return id;
    const liffState = q.get("liff.state");
    if (liffState) {
      const stateStr = liffState.startsWith("?") ? liffState.slice(1) : liffState;
      const stateQ = new URLSearchParams(stateStr);
      id = stateQ.get("botId");
      if (id) return id;
    }
    return null;
  }

  async function init() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      BOT_ID = resolveBotId();
      if (!BOT_ID) return showError("缺 botId 參數 · 請透過 bot 私訊「設密碼」取得連結");
      const profile = await liff.getProfile();
      lineUserId = profile.userId;

      // Reuse LIFF prefill endpoint 拿基本資料 (已綁 case 會回 already_bound)
      const res = await fetch(`${API_BASE}/binding/liff/prefill?botId=${BOT_ID}&lineUserId=${encodeURIComponent(lineUserId)}`);
      const data = await res.json();
      if (data.status !== "already_bound") {
        return showError("尚未完成綁定 · 請先加 bot 好友完成綁定");
      }
      userInfo = { name: data.existing.userDisplayName, tenant: "本公司", dept: "-" };
      document.getElementById("i-name").textContent = userInfo.name;
      document.getElementById("i-tenant").textContent = userInfo.tenant;
      document.getElementById("i-dept").textContent = userInfo.dept;
      document.getElementById("loading").classList.add("hide");
      document.getElementById("form-view").classList.remove("hide");
    } catch (e) {
      showError("初始化失敗 · " + (e.message || e));
    }
  }

  document.getElementById("btn-save").onclick = async () => {
    const email = document.getElementById("f-email").value.trim().toLowerCase();
    const password = document.getElementById("f-password").value;
    const password2 = document.getElementById("f-password2").value;
    const errEl = document.getElementById("err");
    errEl.classList.add("hide");

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showFormError("email 格式錯");
    if (!password) return showFormError("請輸入密碼");
    if (password !== password2) return showFormError("兩次密碼不一致");

    const btn = document.getElementById("btn-save");
    btn.disabled = true; btn.textContent = "儲存中…";
    try {
      const res = await fetch(`${API_BASE}/binding/liff/set-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ botId: BOT_ID, lineUserId, email, password }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ message: "設定失敗" }));
        // 密碼 policy 錯 · 訊息在 err.failures
        const msg = err?.failures?.join("\n") || err?.message || "設定失敗";
        return showFormError(msg);
      }
      document.getElementById("s-email").textContent = email;
      document.getElementById("form-view").classList.add("hide");
      document.getElementById("success-view").classList.remove("hide");
      setTimeout(() => closeLiff(), 1500);
    } catch (e) {
      showFormError(e.message || "設定失敗");
    } finally {
      btn.disabled = false; btn.textContent = "儲存密碼";
    }
  };

  function showFormError(msg) {
    const el = document.getElementById("err");
    el.textContent = msg;
    el.classList.remove("hide");
  }
  function showError(msg) {
    document.getElementById("loading").innerHTML = `<div style="color:var(--danger); font-size:14px;">${escape(msg)}</div>`;
  }
  function escape(s) {
    return String(s || "").replace(/[<>&"']/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function closeLiff() {
    if (liff && liff.closeWindow) liff.closeWindow();
  }

  init();
</script>
</body>
</html>
