<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiproot 戰情室</title>
    <!-- 品牌記號＝根號 √（AIPROOT 的 root）· 造型刻意跟「打勾 ✓」拉開距離：
         這個產品裡打勾是「簽核」的意思，favicon 撞到會誤導。
         關鍵差異是那一橫（vinculum）—— 打勾沒有橫槓。已在 16px 下與打勾並排驗過。
         深色方塊與圓角比例對齊側欄的 .sb-brand-mark（#0F172A · --r）。 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
